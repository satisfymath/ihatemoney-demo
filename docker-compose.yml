# The demo stack: the application and its PostgreSQL database, on one machine.
#
# Secrets come from a `.env` file next to this file (see `.env.example`); nothing here is a real value.
# The project name is fixed so that a deploy from any checkout updates the same stack.
#
#   cp .env.example .env            # then put real values in it
#   docker compose up -d --build --wait
#   curl -fsS http://127.0.0.1:8000/healthcheck
#   docker compose exec app python /src/conf/seed_demo.py     # a realistic amount of data
#
# See https://ihatemoney.readthedocs.io/en/latest/configuration.html for every application setting.

name: ihatemoney-demo

services:
  db:
    image: postgres:17-alpine
    # Queries slower than 200 ms land in the database's log, as an operated instance would have it.
    command: ["postgres", "-c", "log_min_duration_statement=200"]
    environment:
      POSTGRES_USER: ihatemoney
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ihatemoney
      # A read-only role, created once at first start by conf/db-init/10-readonly.sh.
      UNBIDDEN_RO_PASSWORD: ${UNBIDDEN_RO_PASSWORD:?set UNBIDDEN_RO_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./conf/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ihatemoney -d ihatemoney"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: ihatemoney-demo:latest
    # Extra gunicorn arguments (the entrypoint appends them): one access line per request (see conf/gunicorn_access.py).
    command: ["--pythonpath", "/src/conf", "--logger-class", "gunicorn_access.AccessLogger", "--access-logfile", "-"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEBUG=False
      - ACTIVATE_DEMO_PROJECT=True
      - ACTIVATE_ADMIN_DASHBOARD=False
      - ADMIN_PASSWORD=
      - ALLOW_PUBLIC_PROJECT_CREATION=True
      - BABEL_DEFAULT_TIMEZONE=UTC
      - GREENLET_TEST_CPP=no
      - MAIL_DEFAULT_SENDER=Budget manager <admin@example.com>
      - MAIL_PASSWORD=
      - MAIL_PORT=25
      - MAIL_SERVER=localhost
      - MAIL_USE_SSL=False
      - MAIL_USE_TLS=False
      - MAIL_USERNAME=
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY in .env}
      - SESSION_COOKIE_SECURE=False
      - SHOW_ADMIN_EMAIL=True
      - SQLALCHEMY_DATABASE_URI=postgresql+psycopg2://ihatemoney:${POSTGRES_PASSWORD}@db:5432/ihatemoney
      - SQLALCHEMY_TRACK_MODIFICATIONS=False
      - APPLICATION_ROOT=/
      - ENABLE_CAPTCHA=False
      - LEGAL_LINK=
      - PORT=8000
      - PUID=0
      - PGID=0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/healthcheck | grep -q OK"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  db-data:
